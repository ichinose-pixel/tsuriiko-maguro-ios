<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082b44"><title>船釣りゲーム・本編候補</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<canvas id="sea" aria-label="海。左右にドラッグして魚を狙う"></canvas>
<header><div class="brand"><span>タイアップ検討用 / 仮題</span><h1>黒潮一本釣り（仮）</h1></div><button id="bookButton" aria-label="図鑑と釣果記録" hidden>図鑑</button><button id="sound" aria-label="音をオンにする">音 OFF</button><button id="pause" aria-label="設定と一時停止">⚙</button></header>
<section id="hud"><div><small>所持金</small><strong id="money">¥0</strong></div><div><small>仕掛け</small><strong id="capacity">0 / 4 尾</strong></div><div><small>水深</small><strong id="depth">0 m</strong></div></section>
<div id="mission"></div><div id="toast" aria-live="polite"></div><div id="caughtName"></div>
<section id="dock"><div id="result"><span id="recordBadge"></span><span id="resultTitle"></span><strong id="resultMoney"></strong><span id="resultDetail"></span></div>
<div id="upgrades"><button id="upgradeDepth"><span>↓ 深く潜る</span><b></b><small></small></button><button id="upgradeCapacity"><span>⌁ 多く釣る</span><b></b><small></small></button></div>
<button id="cast" class="primary">釣りをはじめる →</button><button id="claim" class="primary" hidden>釣果を受け取る →</button>
<div id="timing" hidden><div class="timing-label">中央でタップ → 深場へ</div><div id="gauge"><i></i><b id="needle"></b></div><button id="drop" class="primary">投下！</button></div>
<div id="steering" hidden><div id="instruction">海を左右にドラッグ</div><div class="dragline"><span>‹</span><b>左右にスライド</b><span>›</span></div><small id="capacityHint"></small></div>
<footer><span>本編候補 · 広告なし</span><span id="saveStatus">自動保存</span></footer></section>
<section id="titleOverlay" class="overlay title-screen" aria-label="タイトル"><div class="title-panel"><span class="eyebrow">ORIGINAL FISHING GAME / 仮題</span><h2 id="titleName">黒潮一本釣り</h2><p>一投ずつ、まだ見ぬ大物へ。</p><div id="titleProgress"></div><button id="enter" class="primary">出航する →</button><small>左右にドラッグ。巻き上げは自動。</small><button id="titleSettings" class="text-button">設定</button></div></section>
<section id="pauseOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="設定と一時停止" hidden><div class="dialog"><span class="eyebrow">ひとやすみ</span><h2>設定</h2><label class="setting-row" for="volume">音量 <output id="volumeValue">65%</output></label><input id="volume" type="range" min="0" max="100" value="65" aria-label="音量"><button id="settingsSound" class="secondary">音をオンにする</button><label class="setting-row check"><input id="motion" type="checkbox"> 光と動きを控えめにする</label><p id="saveNotice">釣りの途中から再開できます</p><p class="small">この開発版は広告・購入なし</p><button id="resume" class="primary">釣りに戻る</button><button id="toTitle" class="text-button">タイトルへ</button></div></section>
<section id="bookOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="図鑑と釣果記録" hidden><div class="dialog book-dialog"><div class="dialog-head"><h2>釣果手帳</h2><button id="closeBook" class="secondary">閉じる</button></div><p id="bookSummary"></p><div id="bookGrid"></div><h3>最近の釣果</h3><div id="historyList"></div></div></section>
</main><script type="module" src="game.js"></script></body></html>
