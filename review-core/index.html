<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#124d58"><title>釣りいこ！マグロ大作戦</title><link rel="stylesheet" href="style.css?v=harbor-r2"></head><body><main id="app">
<canvas id="world" aria-label="朝の港と海"></canvas>
<section id="home" class="page"><div class="home-heading"><p>釣りいこChannel タイアップ</p><h1>釣りいこ！<em>マグロ大作戦</em></h1><span class="harbor-label">朝凪の港</span></div><div class="home-controls"><div id="homeGear"></div><button id="depart" class="primary">出船する <span>→</span></button><div class="home-links"><button id="openShop">釣具屋</button><button id="openBook">魚図鑑</button></div><div class="home-bottom"><button id="homeSettings" class="quiet">音・設定</button><a href="https://www.youtube.com/channel/UCxkgEy3-d_VHMGaD9z88KYQ" target="_blank" rel="noopener noreferrer">釣りいこChannel ↗</a></div></div></section>
<section id="shop" class="page paper" hidden><nav><button id="shopBack" class="back">‹ 港へ</button><h2>釣具屋</h2><strong class="wallet"></strong></nav><canvas id="shopScene" class="shop-scene" width="780" height="270" aria-label="竿とエサ箱が並ぶ潮風釣具店"></canvas><div class="shop-tabs" role="tablist"><button id="rodTab" role="tab" aria-selected="true">竿セット</button><button id="baitTab" role="tab" aria-selected="false">仕掛け・エサ</button></div><p id="shopNote" class="shop-note"></p><div id="products" class="scroll"></div><p id="purchaseMessage" role="status"></p></section>
<section id="book" class="page paper" hidden><nav><button id="bookBack" class="back">‹ 港へ</button><h2>魚図鑑</h2><span id="bookCount"></span></nav><p class="book-caption">出会った一尾が、港の思い出になる。</p><div id="bookGrid" class="scroll"></div></section>
<section id="detail" class="page paper" hidden><nav><button id="detailBack" class="back">‹ 図鑑</button><h2 id="fishName"></h2><button id="detailHome" class="back">港へ</button></nav><div class="fish-plate"><span id="fishNumber"></span><canvas id="fishPortrait" width="780" height="480"></canvas></div><div class="detail-copy"><div id="fishRecords" class="records"></div><h3>狙い方</h3><p id="fishHint"></p><small>このゲームでの出現条件です。</small><p id="fishDescription"></p><button id="detailShop" class="primary">釣具屋で道具を見る</button></div></section>
<section id="play" class="page" hidden><header><button id="sound" class="small-button" aria-label="音を切り替える">音 OFF</button><div id="depthLabel"></div><button id="pause" class="small-button">休憩</button></header><div class="play-stats"><span id="capacity"></span><span id="bandLabel"></span></div><div id="catchToast" role="status"></div><div id="playBottom"><p id="playInstruction"></p><button id="drop" class="primary">投入する</button><p id="playEquipment"></p></div></section>
<section id="result" class="page result-page" hidden><div class="result-heading"><span id="recordBadge"></span><h2 id="resultName"></h2></div><canvas id="resultFish" width="780" height="420"></canvas><div class="result-card"><div id="resultStats"></div><strong id="resultMoney"></strong><button id="claim" class="primary">売上を受け取る</button><p>受け取ったら、港で次の準備を。</p></div></section>
<section id="settings" class="modal" role="dialog" aria-modal="true" aria-label="音と休憩" hidden><div class="settings-card"><h2>ひとやすみ</h2><button id="settingsSound">音をオンにする</button><label>音量 <input id="volume" type="range" min="0" max="100"></label><label class="check"><input id="motion" type="checkbox"> 光と動きを控えめにする</label><button id="resume" class="primary">戻る</button><button id="toHarbor">港に戻る</button><small>音源：CC0 / iamoneabe・Memoraphile・LordTomorrow</small></div></section>
<section id="storageError" class="modal" role="alertdialog" hidden><div class="settings-card"><h2>保存を確認できません</h2><p>データを残して停止しました。保存設定を確認して再読み込みしてください。</p><button onclick="location.reload()">再読み込み</button></div></section>
</main><script type="module" src="game.js?v=harbor-r2"></script></body></html>
